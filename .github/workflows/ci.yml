name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Validar plugin y scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: |
          python -m pip install pillow
          npm install -g @anthropic-ai/claude-code
      - name: Validar marketplace y plugin
        run: |
          claude plugin validate .
          claude plugin validate ./plugins/minecraft-modding
      - name: Tests de scripts
        run: python -m unittest discover -s tests -v

  template:
    name: Compilar plantilla (1.20.1 / 1.21.1 / 1.21.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/minecraft-modding/templates/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 ejecuta Gradle/Stonecraft; 17 y 21 compilan los targets de cada versión.
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build de todos los targets
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndCollect --stacktrace
      - name: Comprobar jars
        run: ls -la build/libs/ && test "$(ls build/libs/*.jar | grep -v sources | wc -l)" -ge 6
      - name: Comprobar rango de Minecraft en los metadatos de cada jar
        shell: python
        run: |
          import glob, json, re, sys, zipfile
          bad = 0
          for jar in sorted(j for j in glob.glob("build/libs/*.jar") if "sources" not in j):
              with zipfile.ZipFile(jar) as z:
                  names = set(z.namelist())
                  if "fabric.mod.json" in names:
                      rng = json.loads(z.read("fabric.mod.json"))["depends"]["minecraft"]
                      ok = "<" in rng or re.fullmatch(r"~?[0-9][0-9.]*", rng)
                  else:
                      toml = next(n for n in ("META-INF/neoforge.mods.toml", "META-INF/mods.toml") if n in names)
                      text = z.read(toml).decode()
                      block = next(b for b in text.split("[[") if re.search(r'(?m)^modId\s*=\s*"minecraft"', b))
                      rng = re.search(r'(?m)^versionRange\s*=\s*"([^"]*)"', block).group(1)
                      ok = not re.search(r",\s*\)$", rng) and "$" not in rng
              print(f"{'OK ' if ok else 'MAL'}  {jar}: minecraft {rng}")
              bad += not ok
          sys.exit(1 if bad else 0)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-jars
          path: |
            plugins/minecraft-modding/templates/mod/build/libs/*.jar
            plugins/minecraft-modding/templates/mod/versions/*/build/reports/**/*
