name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  plugin:
    name: Validar plugin y scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Instalar dependencias
        run: |
          python -m pip install pillow
          npm install -g @anthropic-ai/claude-code
      - name: Validar marketplace y plugin
        run: |
          claude plugin validate .
          claude plugin validate ./plugins/minecraft-modding
      - name: Tests de scripts
        run: python -m unittest discover -s tests -v

  template:
    name: Compilar plantilla (1.20.1 / 1.21.1 / 1.21.11)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: plugins/minecraft-modding/templates/mod
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # 25 ejecuta Gradle/Stonecraft; 17 y 21 compilan los targets de cada versión.
          java-version: |
            17
            21
            25
      - uses: gradle/actions/setup-gradle@v4
      - name: Build de todos los targets
        run: |
          chmod +x ./gradlew
          ./gradlew buildAndCollect --stacktrace
      - name: Comprobar jars
        run: ls -la build/libs/ && test "$(ls build/libs/*.jar | grep -v sources | wc -l)" -ge 6
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: template-jars
          path: |
            plugins/minecraft-modding/templates/mod/build/libs/*.jar
            plugins/minecraft-modding/templates/mod/versions/*/build/reports/**/*
